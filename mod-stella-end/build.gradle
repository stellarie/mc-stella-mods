plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mod-stella-end" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sibling mods join the dev runtime so the bridge tests run with them present.
	// No main class imports them: the mod reaches them only through ObjectShare keys.
	runtimeOnly "com.stella.mobs:mod-stella-mobs:${project.version}"
	runtimeOnly "com.stella.equips:mod-stella-equips-enchants:${project.version}"
	runtimeOnly "com.stella.spells:mod-stella-spells:${project.version}"
	runtimeOnly "com.stella.rpg:mod-stella-rpg:${project.version}"
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mod-stella-end-test-mod-stella-end"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// The game tests read the equips refine rules directly; the mod itself still reaches no sibling class.
dependencies {
	gametestImplementation "com.stella.equips:mod-stella-equips-enchants:${project.version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
