name: Build and release jars

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise. The first release is v1.0.0 either way.
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - id: mods
        name: Detect Gradle mods
        run: |
          mods=$(python3 scripts/build-release.py --list)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

  build-mod:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.discover.outputs.mods) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Assemble ${{ matrix.mod }}
        env:
          MOD_NAME: ${{ matrix.mod }}
        run: python3 scripts/build-release.py --mod "$MOD_NAME"
      - name: Upload production jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mod }}
          path: release-output/jars/
          if-no-files-found: error

  release:
    needs: [discover, build-mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: release-output/jars/
          merge-multiple: true
      - name: Bundle production jars
        env:
          DETECTED_MODS: ${{ needs.discover.outputs.mods }}
        run: python3 scripts/build-release.py --bundle --mods-json "$DETECTED_MODS"
      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mc-stella-mods
          path: release-output/mc-stella-mods.zip
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump || 'patch' }}
          DETECTED_MODS: ${{ needs.discover.outputs.mods }}
        run: |
          version=$(python3 scripts/build-release.py --next-version --bump "$BUMP")
          python3 scripts/build-release.py --pack-jar --mods-json "$DETECTED_MODS" --version "$version"
          gh release create "$version" \
            release-output/mc-stella-mods.zip \
            "release-output/mc-stella-mods-${version#v}.jar" \
            --target "$GITHUB_SHA" --title "$version" --generate-notes
