plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	mods {
		"mod-stella-learn" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The mobs mod is a hard dependency; settings.gradle substitutes its included build.
	implementation "com.stella.mobs:mod-stella-mobs:${project.version}"
}

// The gametest source set holds the test mod that runs the game tests.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mod-stella-learn-test-mod-stella-learn"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('runGameTest') {
	if (project.hasProperty('gameTestFilter')) {
		systemProperty 'fabric-api.gametest.filter', project.property('gameTestFilter')
	}
}
