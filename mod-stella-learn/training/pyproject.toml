[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stella_train"
version = "0.1.0"
description = "Trainer and gym client for the learned mobs"
requires-python = ">=3.12"
# torch is the CPU build: install it with --extra-index-url https://download.pytorch.org/whl/cpu (see README).
dependencies = ["numpy==2.5.1", "torch==2.14.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["stella_train"]

[tool.setuptools.package-data]
stella_train = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
