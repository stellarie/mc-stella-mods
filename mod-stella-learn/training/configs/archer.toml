# Every hyperparameter of the archer run. `python -m stella_train.train --config configs/archer.toml`

[run]
name = "archer"
seed = 1
budget_decisions = 200_000_000   # Stages A to C together
servers = 3                       # oniichan: at most 3 gym servers at once on this PC
arenas = 64
decision_ticks = 2
episode_ticks = 1200
heap = "2g"
eval_every_decisions = 5_000_000
checkpoint_every_decisions = 5_000_000

[ppo]
learning_rate = 3e-4
learning_rate_final = 3e-5
discount = 0.995
gae_lambda = 0.95
clip = 0.2
entropy = 0.005                    # 0.01 let the turn noise climb from 0.30 to 0.38 in 8M decisions
entropy_final = 0.0005
value_coefficient = 0.5
epochs = 4
minibatch = 4096
rollout_per_agent = 256          # decisions per arena in one update
max_grad_norm = 0.5
target_kl = 0.03
log_std_init = -1.2                # 0.5 left too much aim noise for a first arrow to land
bow_bias_init = [-1.0, 1.0, -0.5, -1.0]   # idle, draw, release, volley
jump_bias_init = [0.5, -0.5]
log_std_max = [0.5, 0.5, -1.5, -1.5]    # forward, strafe, yaw, pitch: aim noise above about 0.22 x 30 degrees cannot hit

[shaping]
scale = 1.0                      # the gym prices the terms: +0.005 a hit point dealt, +0.0002 an unhit decision; no decay

[curriculum]
# Stage A ladder: bot max HP bands. A band promotes on this deterministic eval win rate; the 80 percent bar and the 600 to 400 tick drop apply on the last band only.
stage_a_bands = [[10, 10, 0, "static"], [10, 10, 0, "passive"], [10, 14, 4], [14, 18, 4], [18, 22, 4], [22, 26, 4]]   # [hp low, hp high, armor max, target kind]; the first two are practice targets
band0_promote_at = 0.60
band_promote_at = 0.40
band_blocked_decisions = 20_000_000
# Episode length in ticks. Stage A starts at 600 and drops to 400 once its deterministic win rate passes 40 percent.
stage_a_ticks = 600
stage_a_short_at = 0.40
short_ticks = 400
stage_b_ticks = 600
stage_c_ticks = 400
# Stage A promotes at this win rate on the `stage-a` suite.
stage_a_win_rate = 0.80
stage_a_min_decisions = 5_000_000
# Stage B promotes when the win rate has not risen for this many evals, or when its budget share ends.
stage_b_patience_evals = 10
stage_b_budget_share = 0.45
stage_b_min_decisions = 20_000_000
eval_episodes_per_brain = 20

# Bot bodies by stage. Stage A bots are frail; Stage C draws the full range. Sent in every Reset, so a change applies at the next episode.
[body.A]
# The health bounds here are the last band of the Stage A ladder (curriculum.stage_a_bands); the ladder overrides them while it climbs.
hp_min = 22
hp_max = 26
armor_max = 4
toughness_max = 0
protection_max = 0
special_permille = 0

[body.B]
hp_min = 20
hp_max = 40
armor_max = 12
toughness_max = 0
protection_max = 2
special_permille = 0

[body.C]
hp_min = 20
hp_max = 60
armor_max = 20
toughness_max = 12
protection_max = 4
special_permille = 100
