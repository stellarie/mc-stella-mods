pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'mc-stella-nether'

// The whole modpack builds from source beside this mod and substitutes for its coordinates below.
includeBuild '../mc-stella-mobs'
includeBuild '../mc-stella-equips-enchants'
includeBuild '../mc-stella-spells'
includeBuild '../mc-stella-villages'
includeBuild '../mc-stella-tower'
includeBuild '../mc-stella-food'
