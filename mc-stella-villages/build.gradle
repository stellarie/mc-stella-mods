plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def externalMobsJar = project.findProperty("stellaMobsJar")
def mobsJar = file(externalMobsJar ?: "../mc-stella-mobs/build/libs/mc-stella-mobs-${project.version}.jar")

tasks.register('buildStellaMobsJar', GradleBuild) {
	dir = file('../mc-stella-mobs')
	tasks = ['jar']
	onlyIf { externalMobsJar == null }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mc-stella-villages" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation files(mobsJar)

	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods files(mobsJar)
	if (project.findProperty("withStellaSpells") != null) {
		productionRuntimeMods files(stellaSpellsJar())
	}
}

// -PwithStellaSpells=true loads the spells jar built beside this mod; any other value is the jar's own path.
def stellaSpellsJar() {
	def value = project.findProperty("withStellaSpells")
	return value == "true" ? "../mc-stella-spells/build/libs/mc-stella-spells-0.1.0+26.3.jar" : value
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mc-stella-villages-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

afterEvaluate {
	project.dependencies.add("gametestRuntimeOnly", project.files(mobsJar))
	if (project.findProperty("withStellaSpells") != null) {
		project.dependencies.add("gametestRuntimeOnly", project.files(stellaSpellsJar()))
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.named('runGameTest') {
	if (project.hasProperty('gameTestFilter')) {
		systemProperty 'fabric-api.gametest.filter', project.property('gameTestFilter')
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('runGameTest') {
	dependsOn 'buildStellaMobsJar'
	if (project.hasProperty('gameTestFilter')) {
		systemProperty 'fabric-api.gametest.filter', project.property('gameTestFilter')
	}
}

tasks.named('compileJava') {
	dependsOn 'buildStellaMobsJar'
}
