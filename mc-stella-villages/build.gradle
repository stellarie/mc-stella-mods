plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mc-stella-villages" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	if (project.findProperty("withStellaMobs") == "true") {
		productionRuntimeMods files("../mod-stella-mobs/build/libs/mod-stella-mobs-0.1.0+26.3.jar")
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mc-stella-villages-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// V4: -PwithStellaMobs=true loads the built mobs jar into the GameTest run as well, so the suite covers both mods together.
afterEvaluate {
	if (project.findProperty("withStellaMobs") == "true") {
		project.dependencies.add(
			"gametestRuntimeOnly", project.files("../mod-stella-mobs/build/libs/mod-stella-mobs-0.1.0+26.3.jar")
		)
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
